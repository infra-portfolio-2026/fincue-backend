# ================== Datasource ==================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ================== JPA ==================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ================== OAuth2 Client ==================
# Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:5000/login/oauth2/code/google

# Kakao (client-secret 필요시 카카오 개발자 콘솔 > 앱 설정 > 앱 키에서 Client Secret 추가)
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:}
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:5000/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# Naver (네이버 개발자센터 > Application > API 설정에서 Client ID/Secret 발급 후 입력)
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:}
spring.security.oauth2.client.registration.naver.redirect-uri=http://localhost:5000/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.registration.naver.client-name=Naver

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=id

server.port=5000

# ================== Timezone ==================
spring.jackson.time-zone=Asia/Seoul

# ================== MongoDB ==================
spring.data.mongodb.uri=mongodb://localhost:27017/financial_consumer

# ================== Swagger / OpenAPI ==================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# ControllerAdvice 응답 통합 비활성화 (RestControllerAdvice 처리 시 500 방지)
springdoc.override-with-generic-response=false

# ================== JWT ==================
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# ================== FSS 금융상품 API ==================
# 금융감독원 금융상품 통합 비교공시 Open API 인증키 (https://www.fss.or.kr)
fss.api.key=${FSS_API_KEY:}

# ================== 카드고릴라 API (카드 동기화) ==================
# 카드고릴라 내부 API 베이스 URL (선택, 기본값 사용 시 생략 가능)
# cardgorilla.api.base-url=https://api.card-gorilla.com:8080/v1

# ================== Frontend (OAuth2 성공 시 리다이렉트) ==================
# 프론트엔드 없을 때: 백엔드 콜백 페이지 사용 (토큰 표시)
# 프론트엔드 있으면: 예) http://localhost:3000/auth/callback
app.frontend.oauth-redirect-uri=http://localhost:5000/auth/callback

# ================== Chatbot (OpenAI 호환 LLM) ==================
# 로컬 비밀값: src/main/resources/application-local.properties (git 제외) 또는 환경변수 OPENAI_API_KEY
spring.config.import=optional:classpath:application-local.properties
# OpenAI API Key (https://platform.openai.com/api-keys). 비어 있으면 데모 응답으로 fallback.
openai.api.key=${OPENAI_API_KEY:}
# OpenAI 호환 베이스 URL (Azure OpenAI, vLLM, Ollama 등 갈아끼울 때 변경)
openai.api.base-url=https://api.openai.com/v1
# 모델 (gpt-4o-mini = 저렴 + 빠름, gpt-4o = 고품질)
openai.api.model=gpt-4o-mini
# 0~2 사이 (낮을수록 결정적, 금융 도메인이라 0.3~0.5 권장)
openai.api.temperature=0.25
# 시스템 프롬프트 (필요시 오버라이드, 줄바꿈은 \\n 으로)
# chatbot.system-prompt=...